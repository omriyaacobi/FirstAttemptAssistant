<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Option D - Bot design</title>
<link rel="stylesheet" href="shared.css">
<style>
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; flex: 1; min-height: 0; overflow: auto; align-content: start; }
  .col { background: #100e16; border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; }
  .col h3 { font-size: .8rem; color: var(--muted); letter-spacing: .08em; padding: 2px 4px; }
  .req { text-align: left; border-radius: 14px; background: var(--card); padding: 10px 12px; width: 100%; display: block; }
  .req .small { display: block; }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
  .drawer { position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); background: var(--bg); border-left: 1px solid var(--line); display: none; flex-direction: column; z-index: 30; }
  .drawer.on { display: flex; }
  details.acc { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; }
  details.acc summary { cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
  details.acc summary::-webkit-details-marker { display: none; }
  .dock { border-top: 1px solid var(--line); padding: 10px 16px 14px; background: var(--bg); }
  .task { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .task input { width: auto; accent-color: var(--accent); }
</style></head>
<body>
<div id="app" style="display:flex;flex:1;min-height:0;flex-direction:column"></div>
<script src="shared.js"></script>
<script>
banner("D", "Plan first: Improve Bot is a board of requests (working / ready to review / done); open one to chat about it. Courses are one 'today' page with a study plan, plus one dock to chat with any course.");
let drawer, host, active = null, ic;
const reqs = [{ t: "Make the Courses page easier", st: "done", note: "Merged yesterday" }, { t: "Add a quota popup", st: "done", note: "Merged yesterday" }];
let render = () => {};
mountShell($("#app"), {
  chat: (v) => plainChat(v),
  improve: (v) => {
    const top = el("div", "topline"); top.append(el("strong", "grad", "Improve Bot"), Object.assign(el("button", "primary", "+ New request"), { onclick: () => openReq(null) }));
    const board = el("div", "board"); v.append(top, board);
    drawer = el("aside", "drawer"); const h = el("div", "topline"); h.append(el("strong", "", "Request"), Object.assign(el("button", "ghost", "Close"), { onclick: () => drawer.classList.remove("on") }));
    host = el("div"); host.style.cssText = "flex:1;min-height:0;display:flex;flex-direction:column"; drawer.append(h, host); document.body.appendChild(drawer);
    render = () => {
      board.replaceChildren();
      [["working", "WORKING"], ["ready", "READY TO REVIEW"], ["done", "DONE"]].forEach(([k, label]) => {
        const col = el("div", "col"); col.appendChild(el("h3", "", label));
        reqs.filter((r) => r.st === k).forEach((r) => { const b = el("button", "req"); b.append(el("strong", "", r.t), el("span", "muted small", r.note || ""), ...(k === "working" ? [Object.assign(el("div", "bar"), { innerHTML: `<span style="width:${r.pct || 10}%"></span>` })] : [])); b.onclick = () => openReq(r); col.appendChild(b); });
        if (!reqs.some((r) => r.st === k)) col.appendChild(el("div", "muted small", k === "working" ? "Nothing running" : "Empty"));
        board.appendChild(col);
      });
    };
    render();
  },
  courses: (v) => {
    const t = el("div", "topline"); t.append(el("strong", "grad", "Today's study plan"), el("span", "muted small", "Thursday · about 90 minutes")); v.appendChild(t);
    const p = el("div", "pad stack"); const plan = el("div", "card"); plan.appendChild(el("strong", "", "To do today"));
    COURSES.forEach((c) => { const r = el("label", "task"); const i = el("input"); i.type = "checkbox"; r.append(i, el("span", "", c.next), el("span", "badge", c.name)); plan.appendChild(r); }); p.appendChild(plan);
    COURSES.forEach((c, n) => { const d = el("details", "acc"); if (n === 0) d.open = true; const s = el("summary"); const r = el("div", "ring"); r.style.setProperty("--p", c.progress); r.appendChild(el("i", "", c.progress + "%")); r.style.cssText += ";width:40px;height:40px"; s.append(r, el("strong", "", c.name), el("span", "muted small", c.files.length + " files"));
      const b = el("div", "stack"); b.style.marginTop = "10px"; c.files.forEach((f) => { const x = el("div", "file"); x.append(el("span", "dot"), el("span", "grow", f.n)); b.appendChild(x); }); c.topics.forEach((x) => { const l = el("label", "topic"); const i = el("input"); i.type = "checkbox"; i.checked = !!x[1]; l.append(i, document.createTextNode(x[0])); b.appendChild(l); });
      b.appendChild(Object.assign(el("button", "", "Ask about " + c.name), { onclick: () => { sel.value = c.id; ta.focus(); } })); d.append(s, b); p.appendChild(d); });
    v.appendChild(p);
    const dock = el("div", "dock"); const row = el("div", "row"); row.style.cssText = "display:flex;gap:8px;align-items:center";
    const sel = el("select"); COURSES.forEach((c) => sel.appendChild(Object.assign(el("option"), { value: c.id, textContent: c.name }))); sel.style.cssText = "background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px";
    const ta = Object.assign(el("input"), { placeholder: "Ask Bot about the selected course..." }); row.append(sel, ta, el("button", "primary", "Ask")); dock.appendChild(row);
    const ans = el("div", "muted small"); ans.style.marginTop = "6px"; dock.appendChild(ans); row.lastChild.onclick = () => { ans.textContent = "(mockup) Bot answers here, using the files of " + sel.selectedOptions[0].textContent + "."; };
    v.appendChild(dock);
  },
}, { labels: { chat: "Chat", improve: "Improve Bot", courses: "Courses" } });
function openReq(r) {
  host.replaceChildren(); drawer.classList.add("on");
  if (r && r.st === "done") { const c = el("div", "pad"); c.append(el("strong", "", r.t), el("p", "muted", r.note + ". (Mockup: a finished request would show its chat history here.)")); host.appendChild(c); return; }
  if (r && r.ic) { host.appendChild(r.hostEl); return; }
  const mine = r || { t: "New request", st: "working", note: "Just started" }; const h = el("div"); h.style.cssText = "flex:1;min-height:0;display:flex;flex-direction:column"; host.appendChild(h);
  const chat = ImproveChat(h, { onChange: (S) => { const first = S.msgs[0]; if (first) mine.t = first[1].slice(0, 50); mine.st = S.status === "running" ? "working" : S.status === "ready" ? "ready" : "done"; mine.note = S.status === "running" ? "The editor is working" : S.status === "ready" ? "Waiting for your review" : S.status; mine.pct = S.pct; if (!reqs.includes(mine) && first) reqs.unshift(mine); render(); } });
  mine.ic = chat; mine.hostEl = h;
}
</script></body></html>
